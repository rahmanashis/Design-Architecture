<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Design patterns learning map</title>
  <desc id="desc">An animated path from SOLID principles through creational, structural, and behavioral patterns to larger architecture and LLD systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#243b53"/>
    </linearGradient>
    <linearGradient id="principles" x1="0" x2="1">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#52b788"/>
    </linearGradient>
    <linearGradient id="patterns" x1="0" x2="1">
      <stop offset="0" stop-color="#e76f51"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="systems" x1="0" x2="1">
      <stop offset="0" stop-color="#457b9d"/>
      <stop offset="1" stop-color="#6c91bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d9e2ec"/>
    </marker>
    <style>
      .title { font: 700 25px system-ui, sans-serif; fill: #fff; }
      .label { font: 700 21px system-ui, sans-serif; fill: #fff; }
      .small { font: 400 15px system-ui, sans-serif; fill: #e6edf5; }
      .path { stroke: #d9e2ec; stroke-width: 4; stroke-dasharray: 12 12; marker-end: url(#arrow); animation: flow 2.1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      .node { filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#background)"/>
  <text x="56" y="56" class="title">Design Patterns learning map</text>
  <text x="56" y="84" class="small">Learn the reason for a pattern before memorizing its name.</text>

  <line x1="280" y1="220" x2="350" y2="220" class="path"/>
  <line x1="640" y1="220" x2="710" y2="220" class="path"/>
  <line x1="1000" y1="220" x2="1060" y2="220" class="path"/>

  <g class="node">
    <rect x="45" y="145" width="235" height="150" rx="18" fill="url(#principles)"/>
    <text x="78" y="198" class="label">SOLID</text>
    <text x="78" y="228" class="small">Responsibilities, coupling,</text>
    <text x="78" y="250" class="small">abstractions, boundaries.</text>
  </g>
  <g class="node">
    <rect x="350" y="145" width="290" height="150" rx="18" fill="url(#patterns)"/>
    <text x="382" y="198" class="label">Creational</text>
    <text x="382" y="228" class="small">Factory, Builder, Prototype,</text>
    <text x="382" y="250" class="small">Singleton.</text>
  </g>
  <g class="node">
    <rect x="710" y="145" width="290" height="150" rx="18" fill="url(#patterns)"/>
    <text x="742" y="198" class="label">Structural + Behavioral</text>
    <text x="742" y="228" class="small">Adapter, Proxy, Observer,</text>
    <text x="742" y="250" class="small">Strategy, Iterator, Memento.</text>
  </g>
  <g class="node">
    <rect x="1060" y="145" width="105" height="150" rx="18" fill="url(#systems)"/>
    <text x="1080" y="198" class="label">LLD</text>
    <text x="1078" y="228" class="small">Systems</text>
    <text x="1078" y="250" class="small">+ Onion</text>
  </g>
  <text x="56" y="375" class="small">Animated arrows show the recommended direction of study.</text>
</svg>
